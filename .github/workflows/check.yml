name: Scaffold checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: nomad_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
        env:
          NOMAD_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/nomad_test
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and Chromium
        shell: powershell
        run: ./scripts/setup.ps1 -Python (Get-Command python).Source
      - name: Verify generated contracts have no drift
        shell: powershell
        run: |
          ./scripts/contracts.ps1
          git diff --exit-code -- contracts frontend/src/api/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Backend, production build and browser workflow
        shell: powershell
        run: ./scripts/check.ps1 -Browser
