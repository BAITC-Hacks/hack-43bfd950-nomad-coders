name: Scaffold checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and Chromium
        shell: powershell
        run: ./scripts/setup.ps1 -Python (Get-Command python).Source
      - name: Verify generated contracts have no drift
        shell: powershell
        run: |
          ./scripts/contracts.ps1
          git diff --exit-code -- contracts frontend/src/api/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Backend, production build and browser workflow
        shell: powershell
        run: ./scripts/check.ps1 -Browser
